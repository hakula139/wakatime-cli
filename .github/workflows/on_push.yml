name: CI

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, synchronize]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: "go.mod"
  CHECK_LATEST: true
  TEST_VERSION: "<local-build>"

jobs:
  pr-title:
    name: PR Title Check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      -
        uses: amannn/action-semantic-pull-request@v6.1.2
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            ci
            chore
            style
            perf
        env:
          GITHUB_TOKEN: ${{ github.token }}

  unit:
    name: Unit Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          check-latest: ${{ env.CHECK_LATEST }}
          cache: false
      -
        name: Pull dependencies
        run: make install-go-modules
      -
        name: Check generated files are up to date
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          go generate ./...
          git diff --exit-code pkg/heartbeat/language_generated.go || (echo "language_generated.go is out of date. Run 'go generate ./...' and commit the changes." && exit 1)
      -
        name: Unit tests
        run: make test
      -
        name: Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          skip-cache: true
      -
        name: Vulnerability scan
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make vulncheck
      -
        name: Coverage
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests

  integration:
    name: Integration Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build-target: build-linux-amd64 }
          - { os: windows-latest, build-target: build-windows-amd64 }
          - { os: macos-latest, build-target: build-darwin-arm64 }

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          check-latest: ${{ env.CHECK_LATEST }}
          cache: false
      -
        name: Pull dependencies
        run: make install-go-modules
      -
        name: Build binary
        env:
          VERSION: ${{ env.TEST_VERSION }}
        run: make ${{ matrix.build-target }}
      -
        name: Integration tests
        run: make test-integration

  ip-check:
    name: IP Check
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          check-latest: ${{ env.CHECK_LATEST }}
          cache: false
      -
        name: Pull dependencies
        run: make install-go-modules
      -
        name: IP Check
        run: make test-ip

  result:
    name: CI Result
    # A skipped required check passes, so the gate must run after failures too.
    if: ${{ !cancelled() }}
    needs:
      - pr-title
      - unit
      - integration
      - ip-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      -
        name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v3
